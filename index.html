<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atlas of Westeros — Historical Interactive Atlas</title>
  <meta name="description" content="Explore the definitive historical interactive atlas of Westeros and the world of A Song of Ice and Fire. Track castles, houses, and dragons across centuries.">
  
  <!-- Premium Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/panels.css">
  <link rel="stylesheet" href="css/timeline.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <div id="app">
    <!-- Ornate Loader Overlay -->
    <div id="loading-screen">
      <div class="loading-content">
        <h1 class="heading-decorative" style="font-size: 2.8rem; margin-bottom: 0.5rem;">Atlas of Westeros</h1>
        <p class="body-text" style="font-style: italic; color: var(--gold-dark);">Unveiling the Annals of the Seven Kingdoms...</p>
        <div class="loading-bar">
          <div class="loading-progress" style="width: 100%;"></div>
        </div>
      </div>
    </div>

    <!-- Map Container -->
    <div id="map-container"></div>

    <!-- Top Toolbar -->
    <div id="toolbar"></div>

    <!-- Left Filter Panel -->
    <div id="filter-panel"></div>

    <!-- Right Sidebar Info Panel -->
    <div id="info-panel"></div>

    <!-- Bottom Timeline -->
    <div id="timeline"></div>

    <!-- Global Mouse Tooltip -->
    <div id="tooltip" class="map-tooltip" style="display: none;"></div>
  </div>

  <!-- Bootstrapper Module -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
